name: Daily Eval Snapshot

# Runs the analysis-only graph (no trade execution) against the eval
# watchlist once a day and records the decisions to Table Storage -- see
# eval/tracker.py. Daily rather than weekly on purpose: news genuinely
# moves prices day to day, so a once-a-week sample was too coarse to mean
# much as an investor-facing track record, and it also meant missing the
# one weekly run (the Upstox token expires daily -- see
# upstox_auth_store.py) skipped real-holdings tracking for a full week.
# Daily gives many more chances to land on a day the token is fresh.
# workflow_dispatch lets it be triggered manually too, for testing
# without waiting for the schedule.
on:
  schedule:
    # Originally 06:00 UTC (11:30 AM IST), aiming to catch NSE mid-session.
    # In practice GitHub's scheduled-workflow trigger ran ~4h49m late on
    # its first real firing (06:00 UTC scheduled -> ~10:49 UTC actual) --
    # a documented GitHub limitation, not a bug in this repo: scheduled
    # runs get deprioritized under load and have no timing guarantee,
    # especially on free-tier/public repos. That pushed the snapshot past
    # NSE close (3:30 PM IST / 10:00 UTC) anyway, so instead of fighting
    # an unreliable trigger to hit an *intraday* price, this now
    # deliberately targets *after* close: 11:00 UTC / 4:30 PM IST, an
    # hour past close. yfinance returns the same final closing price from
    # close until the next 9:15 AM IST open, so any delay landing
    # anywhere in that ~17-hour window -- even one as large as the 4h49m
    # already observed -- still gets the correct, final closing price.
    # This also makes day-over-day returns a clean close-to-close
    # comparison instead of a mix of random intraday and post-close
    # snapshots depending on how late GitHub happened to run that day.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  record-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /eval/record-snapshot
        run: |
          curl -sf -X POST \
            "https://roundtable-api.lemonwater-fd61f0be.germanywestcentral.azurecontainerapps.io/eval/record-snapshot" \
            -H "X-Eval-Secret: ${{ secrets.EVAL_TRIGGER_SECRET }}"
